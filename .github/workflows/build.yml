name: crDroid 13 God Level Build - Redmi 12 5G (sky)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Safe & Deep Space Cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: ⚙️ Setup God Level Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc coreutils device-tree-compiler git libncurses5-dev lz4 \
          m4 make zip gawk wget python3 python2 flex bison gperf \
          libsdl1.2-dev build-essential curl libstdc++6 \
          lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig

      - name: 🚀 Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

      - name: ⚡ Initialize crDroid 13 Base
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "GodLevelDev"
          git config --global user.email "godlevel@crdroid.net"
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1

      - name: 📥 Sync Base ROM (No Manifest Errors!)
        run: |
          cd ~/crdroid
          # Normal sync bina kisi extra tree ke, taaki koi branch error na aaye
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 📱 FORCE CLONE Hardware Trees (The Brahmastra)
        run: |
          cd ~/crdroid
          echo "Force cloning Device, Kernel, and Vendor directly..."
          # Yeh bina branch puche default file download kar lega!
          git clone --depth 1 https://github.com/altafyafai7/android_device_xiaomi_sky.git device/xiaomi/sky
          git clone --depth 1 https://github.com/altafyafai7/android_kernel_xiaomi_sky_upstream.git kernel/xiaomi/sky
          git clone --depth 1 https://github.com/Evolution-X-Devices/vendor_xiaomi_sky.git vendor/xiaomi/sky

      - name: 🛠️ Force Fix QCOM-CAF Common
        run: |
          cd ~/crdroid
          echo "Removing faulty qcom-caf and injecting the correct one..."
          rm -rf hardware/qcom-caf/common || true
          git clone --depth 1 https://github.com/LineageOS/android_hardware_qcom-caf_common.git -b lineage-20.0 hardware/qcom-caf/common

      - name: 🎩 Magic Cross-Port Script
        run: |
          cd ~/crdroid/device/xiaomi/sky
          rm -f vendorsetup.sh || true
          
          # Converting names to crDroid
          for f in evolution_*.mk evox_*.mk aosp_*.mk lineage_*.mk; do [ -f "$f" ] && mv "$f" "${f//evolution_/crdroid_}" && mv "$f" "${f//evox_/crdroid_}" && mv "$f" "${f//aosp_/crdroid_}" && mv "$f" "${f//lineage_/crdroid_}"; done || true
          
          sed -i 's/evolution_/crdroid_/g' * || true
          sed -i 's/evox_/crdroid_/g' * || true
          sed -i 's/lineage_/crdroid_/g' * || true
          
          sed -i '/BoardConfigReservedSize/d' BoardConfig.mk || true

      - name: 🗑️ ULTIMATE SPACE HACK
        run: |
          cd ~/crdroid
          rm -rf .repo
          sudo apt-get clean

      - name: 🔥 Inject Max Performance & Build ROM
        run: |
          cd ~/crdroid
          export WITH_GAPPS=true
          export TARGET_USE_F2FS=true
          export KBUILD_BUILD_USER="GodLevel"
          export KBUILD_BUILD_HOST="crDroid"
          export CCACHE_DISABLE=1
          
          source build/envsetup.sh
          lunch crdroid_sky-userdebug
          mka bacon

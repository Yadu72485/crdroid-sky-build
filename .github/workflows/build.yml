name: crDroid 13 God Level Build - Redmi 12 5G (sky)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Safe & Deep Space Cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: ⚙️ Setup God Level Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc coreutils device-tree-compiler git libncurses5-dev lz4 \
          m4 make zip gawk wget python3 python2 flex bison gperf \
          libsdl1.2-dev build-essential curl libstdc++6 \
          lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig

      - name: 🚀 Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

      - name: ⚡ Initialize crDroid 13 Base
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "GodLevelDev"
          git config --global user.email "godlevel@crdroid.net"
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1

      - name: 📥 Sync Base ROM (No Manifest Errors!)
        run: |
          cd ~/crdroid
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 📱 FORCE CLONE Hardware Trees (The Brahmastra)
        run: |
          cd ~/crdroid
          echo "Force cloning Device, Kernel, and Vendor directly..."
          git clone --depth 1 https://github.com/altafyafai7/android_device_xiaomi_sky.git device/xiaomi/sky
          git clone --depth 1 https://github.com/altafyafai7/android_kernel_xiaomi_sky_upstream.git kernel/xiaomi/sky
          git clone --depth 1 https://github.com/Evolution-X-Devices/vendor_xiaomi_sky.git vendor/xiaomi/sky

      - name: 🛠️ Force Fix Missing Hardware Dependencies (QCOM & Xiaomi)
        run: |
          cd ~/crdroid
          echo "Removing faulty qcom-caf and injecting the correct one..."
          rm -rf hardware/qcom-caf/common || true
          git clone --depth 1 https://github.com/LineageOS/android_hardware_qcom-caf_common.git -b lineage-20.0 hardware/qcom-caf/common
          
          echo "Injecting missing Xiaomi hardware namespace for our specific device..."
          rm -rf hardware/xiaomi || true
          git clone --depth 1 https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-20.0 hardware/xiaomi

      - name: 🎩 EXPLICIT Magic Cross-Port Script (Blueprint Hack)
        run: |
          cd ~/crdroid/device/xiaomi/sky
          rm -f vendorsetup.sh || true
          
          echo "Renaming main makefiles explicitly..."
          mv aosp_sky.mk crdroid_sky.mk || true
          mv lineage_sky.mk crdroid_sky.mk || true
          mv evolution_sky.mk crdroid_sky.mk || true
          mv evox_sky.mk crdroid_sky.mk || true
          
          echo "Updating AndroidProducts.mk references..."
          sed -i 's/aosp_sky/crdroid_sky/g' AndroidProducts.mk || true
          sed -i 's/lineage_sky/crdroid_sky/g' AndroidProducts.mk || true
          sed -i 's/evolution_sky/crdroid_sky/g' AndroidProducts.mk || true
          sed -i 's/evox_sky/crdroid_sky/g' AndroidProducts.mk || true
          
          echo "Updating internal variables in crdroid_sky.mk..."
          sed -i 's/aosp_/crdroid_/g' crdroid_sky.mk || true
          sed -i 's/lineage_/crdroid_/g' crdroid_sky.mk || true
          sed -i 's/evolution_/crdroid_/g' crdroid_sky.mk || true
          sed -i 's/evox_/crdroid_/g' crdroid_sky.mk || true
          
          echo "NUKING BoardConfig errors from ALL files..."
          grep -rl 'BoardConfigReservedSize' . | xargs sed -i '/BoardConfigReservedSize/d' || true
          
          echo "NUKING the qcom-caf common.mk error permanently..."
          grep -rl 'hardware/qcom-caf/common/common.mk' . | xargs sed -i '/hardware\/qcom-caf\/common\/common.mk/d' || true
          
          echo "NUKING the Dolby error permanently..."
          grep -rl 'hardware/dolby/dolby.mk' . | xargs sed -i '/hardware\/dolby\/dolby.mk/d' || true
          
          echo "NUKING the BCR (Call Recorder) error permanently..."
          grep -rl 'vendor/bcr/bcr.mk' . | xargs sed -i '/vendor\/bcr\/bcr.mk/d' || true
          
          echo "NUKING install_symlink from Blueprint files (The New Fix)..."
          find . -type f -name "Android.bp" -exec sed -i '/install_symlink/,/}/d' {} + || true

      - name: 🗑️ ULTIMATE SPACE HACK
        run: |
          cd ~/crdroid
          rm -rf .repo
          sudo apt-get clean

      - name: 🔥 Inject Max Performance & Build ROM
        run: |
          cd ~/crdroid
          export WITH_GAPPS=true
          export TARGET_USE_F2FS=true
          export KBUILD_BUILD_USER="GodLevel"
          export KBUILD_BUILD_HOST="crDroid"
          export CCACHE_DISABLE=1
          
          source build/envsetup.sh
          lunch crdroid_sky-userdebug
          mka bacon

name: crDroid 15 Build for Redmi 12 5G (sky)

on:
  workflow_dispatch: # Yeh line hume manual 'Run' button degi

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Free up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Initialize & Sync crDroid Source
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "Yadu72485"
          git config --global user.email "crdroidbuild@example.com"
          mkdir -p ~/crdroid
          cd ~/crdroid
          ~/bin/repo init -u https://github.com/crdroidandroid/android.git -b 15.0 --git-lfs
          
      - name: Inject Local Manifest & Features
        run: |
          cd ~/crdroid
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifest.xml .repo/local_manifests/
          cp $GITHUB_WORKSPACE/build_tweaks.sh ./
          chmod +x build_tweaks.sh
          ~/bin/repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          ./build_tweaks.sh
          
      - name: Build ROM
        run: |
          cd ~/crdroid
          source build/envsetup.sh
          lunch lineage_sky-userdebug
          mka bacon
          
      - name: Upload ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-15-sky-ROM
          path: ~/crdroid/out/target/product/sky/*.zip

name: crDroid 13 Ultimate God Level Build - Redmi 12 5G (sky)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Safe & Deep Space Cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: ⚙️ Setup God Level Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc coreutils device-tree-compiler git libncurses5-dev lz4 \
          m4 make zip gawk wget python3 python2 flex bison gperf \
          libsdl1.2-dev build-essential curl libstdc++6 \
          lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig

      - name: 🚀 Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

      - name: ⚡ Initialize & Shallow Sync crDroid 13 (Super Fast)
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "GodLevelDev"
          git config --global user.email "godlevel@crdroid.net"
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 📱 Clone Redmi 12 5G (sky) Native Hardware Trees
        run: |
          cd ~/crdroid
          mkdir -p .repo/local_manifests
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/sky.xml
          echo '<manifest>' >> .repo/local_manifests/sky.xml
          echo '  <project path="device/xiaomi/sky" name="xiaomi-sm4450-devs/android_device_xiaomi_sky" remote="github" branch="13" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="vendor/xiaomi/sky" name="xiaomi-sm4450-devs/android_vendor_xiaomi_sky" remote="github" branch="13" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="kernel/xiaomi/sky" name="xiaomi-sm4450-devs/android_kernel_xiaomi_sky" remote="github" branch="13" />' >> .repo/local_manifests/sky.xml
          echo '</manifest>' >> .repo/local_manifests/sky.xml
          
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 🗑️ ULTIMATE SPACE HACK (Delete .repo to save 40GB+)
        run: |
          cd ~/crdroid
          echo "Dumping heavy hidden files to free up massive space..."
          rm -rf .repo
          sudo apt-get clean

      - name: 🔥 Inject Max Performance & Build ROM
        run: |
          cd ~/crdroid
          export WITH_GAPPS=true
          export TARGET_USE_F2FS=true
          export KBUILD_BUILD_USER="GodLevel"
          export KBUILD_BUILD_HOST="crDroid"
          export CCACHE_DISABLE=1
          
          source build/envsetup.sh
          lunch crdroid_sky-userdebug
          mka bacon

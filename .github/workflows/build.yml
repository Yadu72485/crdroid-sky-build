name: crDroid 15 God Level Build - Redmi 12 5G (sky)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Extreme Space Cleanup
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: ⚙️ Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc coreutils device-tree-compiler git libncurses5-dev lz4 \
          m4 make zip gawk wget python3 python2 flex bison gperf \
          libsdl1.2-dev build-essential curl libstdc++6 \
          lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig

      - name: 🚀 Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

      - name: ⚡ Initialize & Shallow Sync crDroid 15 Source
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "Yadu72485"
          git config --global user.email "yadu@example.com"
          repo init -u https://github.com/crdroidandroid/android.git -b 15.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 📱 Clone Redmi 12 5G (sky) Device Trees & Vendor
        run: |
          cd ~/crdroid
          # Creating local manifests folder for sky
          mkdir -p .repo/local_manifests
          
          # Adding device specific manifest for Redmi 12 5G (sky)
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/sky.xml
          echo '<manifest>' >> .repo/local_manifests/sky.xml
          echo '  <project path="device/xiaomi/sky" name="crdroidandroid/android_device_xiaomi_sky" remote="github" branch="15.0" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="vendor/xiaomi/sky" name="crdroidandroid/android_vendor_xiaomi_sky" remote="github" branch="15.0" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="kernel/xiaomi/sky" name="crdroidandroid/android_kernel_xiaomi_sky" remote="github" branch="15.0" />' >> .repo/local_manifests/sky.xml
          echo '</manifest>' >> .repo/local_manifests/sky.xml
          
          # Syncing device trees
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 🔥 Inject God Level Flags & Build ROM for sky
        run: |
          cd ~/crdroid
          export WITH_GAPPS=true
          export TARGET_USE_F2FS=true
          source build/envsetup.sh
          lunch crdroid_sky-userdebug
          mka bacon

name: crDroid 13 God Level Expert Build - Redmi 12 5G (sky)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Safe & Deep Space Cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: ⚙️ Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc coreutils device-tree-compiler git libncurses5-dev lz4 \
          m4 make zip gawk wget python3 python2 flex bison gperf \
          libsdl1.2-dev build-essential curl libstdc++6 \
          lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig

      - name: 🚀 Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=~/bin:$PATH" >> $GITHUB_ENV

      - name: ⚡ Initialize crDroid 13 Base
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "GodLevelDev"
          git config --global user.email "godlevel@crdroid.net"
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1

      - name: 📱 Add Hardware Manifests (The Fix)
        run: |
          cd ~/crdroid
          mkdir -p .repo/local_manifests
          
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/sky.xml
          echo '<manifest>' >> .repo/local_manifests/sky.xml
          
          # Adding Trees
          echo '  <project path="device/xiaomi/sky" name="altafyafai7/android_device_xiaomi_sky" remote="github" revision="main" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="kernel/xiaomi/sky" name="altafyafai7/android_kernel_xiaomi_sky_upstream" remote="github" revision="main" />' >> .repo/local_manifests/sky.xml
          echo '  <project path="vendor/xiaomi/sky" name="Evolution-X-Devices/vendor_xiaomi_sky" remote="github" revision="bka" />' >> .repo/local_manifests/sky.xml
          
          # Adding missing QCOM CAF common (The fix for your error)
          echo '  <project path="hardware/qcom-caf/common" name="LineageOS/android_hardware_qcom-caf_common" remote="github" revision="lineage-20" />' >> .repo/local_manifests/sky.xml
          
          echo '</manifest>' >> .repo/local_manifests/sky.xml

      - name: 📥 Sync All Dependencies
        run: |
          cd ~/crdroid
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: 🎩 Magic Cross-Port Script
        run: |
          cd ~/crdroid/device/xiaomi/sky
          rm -f vendorsetup.sh
          # Standardizing files
          for f in evolution_*.mk evox_*.mk aosp_*.mk lineage_*.mk; do [ -f "$f" ] && mv "$f" "${f//evolution_/crdroid_}" && mv "$f" "${f//evox_/crdroid_}" && mv "$f" "${f//aosp_/crdroid_}" && mv "$f" "${f//lineage_/crdroid_}"; done || true
          sed -i 's/evolution_/crdroid_/g' * || true
          sed -i 's/evox_/crdroid_/g' * || true
          sed -i 's/lineage_/crdroid_/g' * || true
          sed -i '/BoardConfigReservedSize/d' BoardConfig.mk || true

      - name: 🗑️ ULTIMATE SPACE HACK
        run: |
          cd ~/crdroid
          rm -rf .repo
          sudo apt-get clean

      - name: 🔥 Inject Max Performance & Build ROM
        run: |
          cd ~/crdroid
          export WITH_GAPPS=true
          export TARGET_USE_F2FS=true
          export KBUILD_BUILD_USER="GodLevel"
          export KBUILD_BUILD_HOST="crDroid"
          export CCACHE_DISABLE=1
          source build/envsetup.sh
          lunch crdroid_sky-userdebug
          mka bacon
